# Language file under plugins/Dummy/lang/. Supported built-in values: zh_CN, en_US.
language: zh_CN

# Default settings applied when a new dummy is created and no saved profile is reused.
defaults:
  # If true, the dummy cannot take any damage.
  invulnerable: false
  # If true, the dummy collides with other entities and can push them.
  collision: true
  # If true, the dummy is affected by gravity and block collisions.
  # Disable it for a floating ghost-like dummy that can pass through blocks.
  physics: true
  # If true, the dummy counts as a player for natural mob spawning and therefore
  # makes nearby chunks spawn mobs, and phantoms may spawn around it.
  # Keep it false to only load machines.
  spawning: false
  # If true, keep chunks around the dummy loaded and ticking using chunk-radius.
  chunk-loader: true
  # Chunk radius (0-32) used when chunk-loader is true.
  # 0 loads only the chunk the dummy stands in; larger values load a square area.
  # Random ticks (crops, fire spread) require a radius of at least 1.
  chunk-radius: 0
  show-in-tab: false
  name-format: "%name%"
  
# Spawn limits. Use -1 for unlimited.
limits:
  # Maximum number of active dummies on the whole server.
  server-total: -1
  # Maximum number of active dummies created by each player. Console is not limited by this value.
  per-player: -1
  # Upper bound for a dummy's chunk radius (0-32). Use -1 to follow each world's
  # simulation-distance, which is also the server's own chunk loading radius.
  max-chunk-radius: -1

storage:
  # Restore active dummies from storage when the plugin starts.
  restore-on-startup: true
  # If enabled, removing a dummy stores its inventory, skin, exp and settings.
  # Re-spawning the same name will reuse that data at the new spawn location.
  keep-removed-data: true
  # 自动保存间隔（ticks）。dirty 标记会在此周期后批量 upsert 到 sqlite。
  # 设置为 -1 禁用自动保存，仅在 shutdown 时落盘（不推荐）。
  auto-save-interval-ticks: 600
  # 是否从旧 dummies.yml 迁移到 SQLite（dummies.db 已存在时无效）。
  migrate-from-yml: true

skins:
  # Cached signed Mojang texture properties are reused for this many hours.
  # Use -1 to keep cached skins forever.
  cache-expires-hours: 24

inventory:
  # Drop all inventory, armor and offhand items when a dummy leaves through remove/shutdown.
  drop-on-quit: false

commands:
  # Commands executed by console before creating a dummy player.
  # Placeholders: %dummy%, %uuid%, %creator%, %creator_uuid%, %world%, %x%, %y%, %z%
  before-spawn: []
  # Commands executed by console after the dummy has joined the server.
  # Uses the same placeholders as before-spawn.
  after-spawn: []

death:
  # If true, a dead dummy is removed and spawned again at its respawn location.
  # If false, dead dummies are removed after death.
  auto-resummon: false

actions:
  # If true, repeated actions are paused instead of stopped when a dummy dies,
  # quits, or is removed, and resume when the same UUID dummy appears again.
  preserve-on-lifecycle: true
  attack:
    # If true, attack falls back to the nearest visible living entity when no
    # locked target exists and no entity is directly looked at.
    auto-target-nearest-visible: false
  mount:
    # Search radius for nearby mountable living entities.
    range: 4
